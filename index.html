<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101726"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Roman HQ"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Roman HQ Fitness</title><style>
:root{color-scheme:dark;--bg:#0b101b;--panel:#161e2e;--panel2:#1d283b;--line:#303d52;--muted:#a4b0c4;--orange:#ff914d;--white:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}header{padding:calc(18px + env(safe-area-inset-top)) 18px 14px;background:#101726;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0;letter-spacing:.3px}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 10px}small,.muted{color:var(--muted)}main{max-width:650px;margin:auto;padding:18px 14px}section{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:14px}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;font-size:11px;font-weight:800;color:var(--orange)}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:9px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pill{border:1px solid var(--line);border-radius:100px;padding:5px 9px;font-size:12px;color:var(--muted)}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px 15px;background:var(--panel2);color:var(--white);font-weight:700;cursor:pointer;min-height:44px}button.primary{background:var(--orange);color:#15100c}button.ghost{background:transparent;border:1px solid var(--line)}button.danger{color:#ff9b9b}button:disabled{opacity:.4}input,select,textarea{background:#0f1725;color:var(--white);border:1px solid #40506a;border-radius:10px;padding:11px;width:100%;min-width:0;font-size:16px}input[type=checkbox]{width:23px;height:23px;accent-color:var(--orange)}label{font-size:13px;color:var(--muted);display:grid;gap:5px}nav{position:fixed;bottom:0;left:0;right:0;background:#101726;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:10}nav button{padding:9px 2px;font-size:11px;background:transparent;color:var(--muted)}nav button.active{color:var(--orange);background:#222c3d}.exercise{border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:12px}.setrow{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:8px;align-items:center;margin-top:8px}.setrow input{padding:10px 7px;text-align:center}.setrow span{color:var(--muted);text-align:center}.sethead{font-size:11px;color:var(--muted);text-align:center}.banner{background:#2d251f;border-color:#76543a}.stats{font-size:26px;font-weight:800;color:var(--orange)}.mini{font-size:13px}.dateinput{max-width:180px}.hidden{display:none!important}hr{border:0;border-top:1px solid var(--line);margin:16px 0}.toast{position:fixed;bottom:95px;left:20px;right:20px;background:#2b4b3c;border-radius:12px;padding:12px;text-align:center;z-index:20;display:none}a{color:var(--orange)}.wrap{flex-wrap:wrap}p{line-height:1.5} .progress{height:7px;background:#354157;border-radius:5px;overflow:hidden}.progress div{height:100%;background:var(--orange)}
</style></head><body><header><div class="flex"><div><div class="eyebrow">Your personal training log</div><h1>ROMAN HQ <span style="color:var(--orange)">FITNESS</span></h1></div><span class="pill">iPhone edition</span></div></header><main id="app"></main><nav><button data-tab="today" class="active">◉<br>Today</button><button data-tab="plan">▤<br>Plan</button><button data-tab="history">◷<br>History</button><button data-tab="progress">↗<br>Progress</button><button data-tab="settings">⚙<br>Settings</button></nav><div class="toast" id="toast"></div><script>
(()=>{'use strict';const KEY='roman-hq-fitness-v1';const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const SPLIT=['Stretch + Basketball','Chest & Back','Biceps & Triceps','Run Only','Legs','Recovery / Flexible','Shoulders'];const seed=[['Leg extensions',4,'8–10'],['Lying hamstring curls',4,'8–10'],['Calf raises',4,'8–10'],['Hip adductor',4,'8–10'],['Hip abductor',4,'8–10']].map((x,i)=>({id:'leg-'+i,name:x[0],sets:x[1],target:x[2]}));const empty=()=>({version:1,templates:{4:seed},logs:{},notes:{},created:new Date().toISOString()});let data;try{data=JSON.parse(localStorage.getItem(KEY))||empty();if(!data.templates||!data.logs)throw Error('bad')}catch(e){data=empty()}let tab='today',selected=today(),planDay=4,reportWeek=today();const app=document.getElementById('app');function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function dayOf(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getDay()}function pretty(s){return new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Storage full or unavailable. Export a backup before continuing.');return false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2300)}function currentTemplates(day){return data.templates[day]||[]}function getLog(date){return data.logs[date]||{status:'planned',sets:{},run:'',games:'',energy:'',sleep:'',note:''}}function ensureLog(date){if(!data.logs[date])data.logs[date]=getLog(date);return data.logs[date]}function gamesExpected(date){return date>='2026-10-18'&&date<='2026-12-06'&&dayOf(date)===0}function dayName(date){return dayOf(date)===0&&!gamesExpected(date)?'Stretch / Recovery':SPLIT[dayOf(date)]}function button(s,cls='',attr=''){return `<button class="${cls}" ${attr}>${s}</button>`}function setCount(log){return Object.values(log.sets||{}).flat().filter(x=>x&&(x.weight!==''||x.reps!=='')).length}function lastExercise(id,date){return Object.entries(data.logs).filter(([d,l])=>d<date&&(l.sets||{})[id]?.some(s=>s&&(s.weight!==''||s.reps!==''))).sort((a,b)=>b[0].localeCompare(a[0]))[0]}
function todayView(){const d=dayOf(selected),items=currentTemplates(d),log=getLog(selected);let html=`<section><div class="eyebrow">Workout tracker</div><div class="flex wrap"><h2>${esc(dayName(selected))}</h2><span class="pill">${esc(log.status==='completed'?'Completed':'Not completed')}</span></div><div class="flex"><button data-action="prev">‹</button><input aria-label="Workout date" class="dateinput" type="date" id="date" value="${selected}"><button data-action="next">›</button></div><p class="muted mini">${pretty(selected)} · Your workout is never marked complete automatically.</p></section>`;if([1,2,4,6].includes(d)){html+=`<section><div class="flex"><h3>Exercises</h3>${button('Edit template','ghost','data-action="planDay"')}</div>${items.length?`<p class="muted mini">Enter actual weight and reps. Changes save automatically on this iPhone.</p>`:'<p class="muted">No exercises added yet. Build this day’s template yourself.</p>'}`;items.forEach(ex=>{let last=lastExercise(ex.id,selected);const sets=log.sets[ex.id]||[];html+=`<div class="exercise"><div class="flex"><strong>${esc(ex.name)}</strong><span class="pill">${ex.sets} sets · ${esc(ex.target)} reps</span></div>${last?`<p class="mini muted">Previous ${pretty(last[0])}: ${last[1].sets[ex.id].map(x=>x&&x.weight&&x.reps?`${esc(x.weight)}lb × ${esc(x.reps)}`:'—').join(' · ')}</p>`:''}<div class="setrow sethead"><span>Set</span><span>Weight (lb)</span><span>Reps</span><span>Done</span></div>`;for(let i=0;i<ex.sets;i++){const s=sets[i]||{};html+=`<div class="setrow"><span>${i+1}</span><input type="number" inputmode="decimal" min="0" step="any" placeholder="lb" data-set="${esc(ex.id)}" data-idx="${i}" data-field="weight" value="${esc(s.weight??'')}"><input type="number" inputmode="numeric" min="0" step="1" placeholder="reps" data-set="${esc(ex.id)}" data-idx="${i}" data-field="reps" value="${esc(s.reps??'')}"><input aria-label="Set completed" type="checkbox" data-set="${esc(ex.id)}" data-idx="${i}" data-field="done" ${s.done?'checked':''}></div>`}html+='</div>'});html+=`<p class="mini muted">${setCount(log)} sets with entries</p></section>`}html+=`<section><h3>Daily activity & recovery</h3><div class="cols"><label>Running miles<input type="number" min="0" step="0.1" inputmode="decimal" data-daily="run" value="${esc(log.run)}" placeholder="0.0"></label><label>Basketball games<input type="number" min="0" step="1" inputmode="numeric" data-daily="games" value="${esc(log.games)}" placeholder="0"></label><label>Energy (1–5)<select data-daily="energy"><option value="">Choose</option>${[1,2,3,4,5].map(x=>`<option value="${x}" ${String(log.energy)===String(x)?'selected':''}>${x}</option>`).join('')}</select></label><label>Sleep (hours)<input type="number" min="0" max="24" step="0.1" inputmode="decimal" data-daily="sleep" value="${esc(log.sleep)}" placeholder="7.5"></label></div>${gamesExpected(selected)?'<p class="mini muted">Two Sunday basketball games are planned weekly through early December; log the actual number played.</p>':''}<label style="margin-top:12px">Workout notes<textarea rows="2" data-daily="note" placeholder="How did it feel?">${esc(log.note)}</textarea></label><hr><div class="flex wrap">${button(log.status==='completed'?'✓ Completed — tap to undo':'Mark workout complete','primary','data-action="toggleComplete"')}${button('Save entries','ghost','data-action="save"')}</div></section>`;return html}
function planView(){const items=currentTemplates(planDay);return `<section><div class="eyebrow">Your exercises, your choices</div><h2>Workout templates</h2><p class="muted mini">Add your exercises once. They'll show up on that day every week. Editing a template does not erase past logs.</p><label>Select day<select id="plan-day">${DAYS.map((x,i)=>`<option value="${i}" ${planDay===i?'selected':''}>${x} — ${SPLIT[i]}</option>`).join('')}</select></label></section><section><h3>${DAYS[planDay]} · ${SPLIT[planDay]}</h3>${items.length?items.map((x,i)=>`<div class="exercise"><div class="flex"><strong>${esc(x.name)}</strong><button class="ghost danger" data-action="remove" data-id="${esc(x.id)}">Remove</button></div><div class="cols" style="margin-top:10px"><label>Sets<input type="number" min="1" max="20" data-template="${esc(x.id)}" data-field="sets" value="${x.sets}"></label><label>Target reps<input data-template="${esc(x.id)}" data-field="target" value="${esc(x.target)}"></label></div></div>`).join(''):'<p class="muted">No exercises yet.</p>'}<hr><h3>Add exercise</h3><form id="add-exercise" class="stack"><label>Exercise name<input id="new-name" required placeholder="e.g. Incline dumbbell press"></label><div class="cols"><label>Sets<input id="new-sets" type="number" min="1" max="20" value="4" required></label><label>Target reps<input id="new-target" value="8–10" required></label></div><button class="primary" type="submit">+ Save exercise</button></form></section>`}
function historyView(){const entries=Object.entries(data.logs).filter(([d,l])=>l.status==='completed'||setCount(l)||l.run||l.games||l.note).sort((a,b)=>b[0].localeCompare(a[0]));const complete=entries.filter(([d,l])=>l.status==='completed').length;const miles=entries.reduce((n,[d,l])=>n+(Number(l.run)||0),0);return `<section><div class="eyebrow">Your progress</div><h2>Workout history</h2><div class="three"><div><div class="stats">${complete}</div><small>Completed</small></div><div><div class="stats">${entries.length}</div><small>Logged days</small></div><div><div class="stats">${Math.round(miles*10)/10}</div><small>Run miles</small></div></div></section>${entries.length?entries.map(([date,l])=>`<section><div class="flex"><div><strong>${pretty(date)}</strong><div class="muted mini">${esc(dayName(date))} · ${setCount(l)} sets · ${esc(l.status)}</div></div>${button('Open','ghost',`data-action="open" data-date="${date}"`)}</div>${l.run?`<p class="mini">Run: ${esc(l.run)} mi</p>`:''}${l.games?`<p class="mini">Basketball: ${esc(l.games)} games</p>`:''}</section>`).join(''):'<section><p class="muted">No workout logs yet. Your first entries will appear here.</p></section>'}`}
function settingsView(){const count=Object.keys(data.logs).length;return `<section><div class="eyebrow">Local-only storage</div><h2>Settings & backups</h2><p>Your workouts are saved in this browser on this iPhone, not on a server. They do not automatically sync. If Safari data is cleared or you change phones, your history may disappear unless you have a backup.</p><p class="mini muted">${count} days saved · ${Object.values(data.templates).flat().length} exercises in templates</p><div class="stack">${button('↓ Export backup file','primary','data-action="export"')}<label>Restore a saved backup<input type="file" id="import-file" accept="application/json,.json"></label>${button('Delete all local workout data','ghost danger','data-action="reset"')}</div></section><section class="banner"><h3>Two-month check-in</h3><p>Review your exercise choices and progress around <strong>December 19, 2026</strong>. Keep or change exercises based on what you've enjoyed and how your numbers have improved.</p></section><section><h3>Add to iPhone Home Screen</h3><p class="mini">Once hosted on an HTTPS website: open the address in Safari → Share → Add to Home Screen. The app can work offline after its files have been loaded and cached.</p><p class="mini muted">This app doesn't access Apple Health or Oura directly. Sleep is entered manually.</p></section>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));app.innerHTML=tab==='today'?todayView():tab==='plan'?planView():tab==='history'?historyView():tab==='progress'?progressView():settingsView()}
function shiftDate(s,delta){const [y,m,d]=s.split('-').map(Number);const a=new Date(y,m-1,d+delta);return [a.getFullYear(),String(a.getMonth()+1).padStart(2,'0'),String(a.getDate()).padStart(2,'0')].join('-')}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;render()}});app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;if(a==='prev'||a==='next')selected=shiftDate(selected,a==='prev'?-1:1);else if(a==='weekPrev'||a==='weekNext')reportWeek=shiftDate(mondayOf(reportWeek),a==='weekPrev'?-7:7);else if(a==='planDay'){planDay=dayOf(selected);tab='plan'}else if(a==='toggleComplete'){const l=ensureLog(selected);l.status=l.status==='completed'?'planned':'completed';save();toast(l.status==='completed'?'Workout marked complete':'Workout marked planned')}else if(a==='save'){save();toast('Saved on this iPhone')}else if(a==='open'){selected=b.dataset.date;tab='today'}else if(a==='remove'){if(confirm('Remove this exercise from future templates? Previous logged sets remain in history.')){data.templates[planDay]=currentTemplates(planDay).filter(x=>x.id!==b.dataset.id);save()}}else if(a==='export'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const el=document.createElement('a');el.href=url;el.download='roman-hq-fitness-backup-'+today()+'.json';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup exported — save it in Files')}else if(a==='reset'){if(confirm('Delete ALL saved workout data on this iPhone? Export a backup first.')&&confirm('Are you absolutely sure? This cannot be undone.')){data=empty();save();toast('Local data reset')}}render()});app.addEventListener('change',async e=>{const t=e.target;if(t.id==='date'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){selected=t.value;render()}return}if(t.id==='plan-day'){planDay=Number(t.value);render();return}if(t.id==='import-file'){const f=t.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj||typeof obj!=='object'||!obj.templates||!obj.logs||typeof obj.templates!=='object'||typeof obj.logs!=='object')throw Error('Invalid backup');if(confirm('Restore this backup? It replaces all current workout data on this iPhone.')){data=obj;save();toast('Backup restored');render()}}catch(err){alert('Could not restore backup. Choose a valid Roman HQ backup JSON file.')}return}if(t.dataset.set){const l=ensureLog(selected);if(!l.sets[t.dataset.set])l.sets[t.dataset.set]=[];const i=Number(t.dataset.idx);if(!l.sets[t.dataset.set][i])l.sets[t.dataset.set][i]={weight:'',reps:'',done:false};const field=t.dataset.field;l.sets[t.dataset.set][i][field]=field==='done'?t.checked:t.value;save();return}if(t.dataset.daily){ensureLog(selected)[t.dataset.daily]=t.value;save();return}if(t.dataset.template){const x=currentTemplates(planDay).find(x=>x.id===t.dataset.template);if(x){x[t.dataset.field]=t.dataset.field==='sets'?Math.min(20,Math.max(1,Number(t.value)||1)):t.value;save();render()}}});app.addEventListener('input',e=>{const t=e.target;if(t.dataset.daily){ensureLog(selected)[t.dataset.daily]=t.value;save()}if(t.dataset.set){const l=ensureLog(selected);if(!l.sets[t.dataset.set])l.sets[t.dataset.set]=[];const i=Number(t.dataset.idx);if(!l.sets[t.dataset.set][i])l.sets[t.dataset.set][i]={weight:'',reps:'',done:false};l.sets[t.dataset.set][i][t.dataset.field]=t.value;save()}});app.addEventListener('submit',e=>{if(e.target.id!=='add-exercise')return;e.preventDefault();const name=document.getElementById('new-name').value.trim();const sets=Math.max(1,Math.min(20,Number(document.getElementById('new-sets').value)||4));const target=document.getElementById('new-target').value.trim();if(!name||!target)return;const id='ex-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);if(!data.templates[planDay])data.templates[planDay]=[];data.templates[planDay].push({id,name,sets,target});save();toast('Exercise saved to weekly template');render()});if(dayOf(today())===0)tab='progress';render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();</script></body></html>
